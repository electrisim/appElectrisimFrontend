<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Top lead (connected pin) -->
  <line x1="50" y1="0" x2="50" y2="48" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Parallel plates (IEC/UK capacitor) -->
  <line x1="18" y1="48" x2="82" y2="48" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
  <line x1="18" y1="68" x2="82" y2="68" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom lead to earth -->
  <line x1="50" y1="68" x2="50" y2="112" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Earthing symbol on the unconnected pin -->
  <line x1="22" y1="112" x2="78" y2="112" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="124" x2="70" y2="124" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="136" x2="62" y2="136" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
</svg>
